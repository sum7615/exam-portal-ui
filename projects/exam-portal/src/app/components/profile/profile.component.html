<div class="p-6 bg-gray-50 min-h-screen">
    <!-- Profile Header -->
    <div class="flex flex-col md:flex-row justify-between gap-8 bg-gray-50 p-6 rounded-lg shadow">
        <!-- User Info Form -->
        <div class="flex-1 bg-white shadow-md rounded-lg p-6 space-y-4">
            <h2 class="text-2xl font-semibold text-gray-800">User Name: {{ userName }}</h2>

            <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-4">
                <!-- Names -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-gray-700 font-medium mb-1">First Name</label>
                        <input formControlName="firstName"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-1">Middle Name</label>
                        <input formControlName="midlename"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-1">Last Name</label>
                        <input formControlName="lastname"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                    </div>
                </div>

                <!-- DOB -->
                <div>
                    <label class="block text-gray-700 font-medium mb-1">DOB</label>
                    <input type="date" formControlName="dob"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                </div>

                <!-- Emails -->
                <div formArrayName="emails" class="space-y-2">
                    <label class="block text-gray-700 font-medium mb-1">Emails</label>
                    <div *ngFor="let email of emails.controls; let i = index">
                        <input [formControlName]="i"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                    </div>
                </div>

                <!-- Phone Numbers -->
                <div formArrayName="phoneNumbers" class="space-y-2">
                    <label class="block text-gray-700 font-medium mb-1">Phone Numbers</label>
                    <div *ngFor="let phone of phoneNumbers.controls; let i = index">
                        <input [formControlName]="i"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                    </div>
                </div>
            </form>
        </div>
        <!-- Profile Image (Fixed Size) -->
        <div class="flex justify-center md:justify-end">
            <div class="w-40 h-40 rounded-full overflow-hidden shadow-lg border border-gray-200">
                <img src="../../../assets/public/images/uploaded_file/boy.svg" alt="Profile Image"
                    class="w-full h-full object-cover" />
            </div>
        </div>

    </div>

    <!-- Tabs -->
    <div class="mt-6 border-b border-gray-200 flex gap-4">
        <button class="py-2 px-4 font-medium text-gray-700 border-b-2"
            [ngClass]="activeTab === 'access' ? 'border-blue-500 text-blue-600' : 'border-transparent hover:text-blue-500'"
            (click)="activeTab = 'access'">
            Access
        </button>
        <button class="py-2 px-4 font-medium text-gray-700 border-b-2"
            [ngClass]="activeTab === 'address' ? 'border-blue-500 text-blue-600' : 'border-transparent hover:text-blue-500'"
            (click)="activeTab = 'address'">
            Address
        </button>
    </div>

    <!-- Tab Content -->
    <div class="mt-4 space-y-6">
        <!-- Access Tab -->
        <div *ngIf="activeTab === 'access'" class="bg-white p-4 rounded shadow">
            <div>
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Role</h3>
                <ul class="list-disc list-inside text-gray-600">
                    <li *ngFor="let role of profileData.roles">{{ role }}</li>
                </ul>
            </div>
            <div class="mt-4">
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Permission</h3>
                <ul class="list-disc list-inside text-gray-600">
                    <li *ngFor="let permision of profileData.actions">{{ permision }}</li>
                </ul>
            </div>
        </div>

        <!-- Address Tab -->
        <form [formGroup]="profileForm">
            <div formArrayName="addreses">
                <div *ngIf="addreses.length > 0 && activeTab === 'address'" class="space-y-4">
                    <div *ngFor="let addressCtrl of addreses.controls; let i = index" [formGroupName]="i"
                        class="bg-white p-4 rounded shadow space-y-2">
                        <h4 class="text-md font-semibold text-gray-700 mb-2">{{ addressCtrl.value.addressTypeName }}
                        </h4>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input formControlName="mainStreet" placeholder="Main Street"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                            <input formControlName="street1" placeholder="Street 1"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                            <input formControlName="street2" placeholder="Street 2"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                            <input formControlName="street3" placeholder="Street 3"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                            <input formControlName="street4" placeholder="Street 4"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                            <input formControlName="countryEng" placeholder="Country"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                            <input formControlName="stateEng" placeholder="State"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                            <input formControlName="cityEng" placeholder="City"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                            <input formControlName="pincode" placeholder="Pincode"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                            <input formControlName="landmark" placeholder="Landmark"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
