<div class="flex flex-col md:flex-row gap-6 bg-gray-50 p-6 rounded-xl shadow-sm">
  <!-- Add / Update Question Bank Card -->
  <mat-card class="flex-1 p-6 shadow-md rounded-2xl">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
      {{ selectedBank ? 'Update Question Bank' : 'Add Question Bank' }}
    </h2>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <mat-form-field class="w-full">
        <mat-label>Name</mat-label>
        <input
          matInput
          name="bankName"
          [(ngModel)]="bankName"
          placeholder="Enter your question bank name"
          required
        />
      </mat-form-field>

      <mat-form-field  class="w-full">
        <mat-label>Description</mat-label>
        <textarea
          matInput
          name="description"
          [(ngModel)]="description"
          placeholder="Description about the question bank"
          rows="3"
        ></textarea>
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>Question Type</mat-label>
        <mat-select name="type" [(ngModel)]="questionType" required>
          <mat-option value="MCQ">MCQ</mat-option>
          <mat-option value="Subjective">Subjective</mat-option>
          <mat-option value="True/False">True / False</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="flex justify-center pt-2 gap-4">
        <button mat-raised-button color="primary" type="submit" class="px-8 py-2">
          {{ selectedBank ? 'Update' : 'Add' }}
        </button>

        <button
          *ngIf="selectedBank"
          mat-raised-button
          color="warn"
          type="button"
          (click)="cancelEdit()"
        >
          Cancel
        </button>
      </div>
    </form>
  </mat-card>

  <!-- All Question Banks Table -->
  <mat-card class="flex-1 p-6 shadow-md rounded-2xl overflow-x-auto">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
      All Question Banks
    </h2>

    <table mat-table class="w-full border border-gray-200 rounded-lg">
      <thead class="bg-gray-100 text-gray-700">
        <tr>
          <th class="py-2 px-4 text-left font-semibold">Name</th>
          <th class="py-2 px-4 text-left font-semibold">Type</th>
          <th class="py-2 px-4 text-left font-semibold">Description</th>
          <th class="py-2 px-4 text-center font-semibold" colspan="2">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let qsn of data" class="hover:bg-gray-50 border-t">
          <td class="py-2 px-4">{{ qsn.name }}</td>
          <td class="py-2 px-4">{{ qsn.questionType }}</td>
          <td class="py-2 px-4">{{ qsn.description }}</td>
          <td class="py-2 px-4 text-center">
            <button mat-stroked-button color="primary" (click)="editBank(qsn)">Edit</button>
          </td>
          <td class="py-2 px-4 text-center">
            <button mat-stroked-button color="warn" (click)="deleteBank(qsn.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!data?.length" class="text-gray-500 text-center py-4">
      No question banks found.
    </div>
  </mat-card>
</div>

<hr class="mt-6 border-gray-300" />
