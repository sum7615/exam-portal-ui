<div class="">
    <!-- header -->
    <app-attemp-header> </app-attemp-header>

    <div class="flex">
        <!-- Sidenav Container -->
        <div class="px-6 bg-gray-600">
            <div class="w-10 bg-white rounded shadow-md" *ngFor="let t of data; let i = index">
                <div>
                    <ul class="mt-3 mb-2">
                        <li class="p-2 cursor-pointer rounded hover:bg-gray-100 transition-colors"
                            (click)="showQuestion(i)">
                            Q{{i+1}}
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div *ngIf="currentQsn" class="mt-3  px-3">
            <span>Title: </span> <span>{{currentQsn.title}}</span>
            <div *ngIf="currentQsn.problemStatementImg">
                <iframe [src]="currentQsn.problemStatementImg" frameborder="0"></iframe>
            </div>
            <div *ngIf="currentQsn.problemStatement">
                Description: {{currentQsn.problemStatement}}
            </div>
            <mat-radio-group aria-label="Select an option" [(ngModel)]="selectedOption"
                class="mt-4 flex flex-col space-y-2">
                <mat-radio-button *ngFor="let option of options; let i = index" [value]="option"
                    class="p-2 rounded-md hover:bg-gray-100 transition-colors">
                    {{ option }}
                </mat-radio-button>
            </mat-radio-group>
        </div>
    </div>
</div>


<app-footer></app-footer>
