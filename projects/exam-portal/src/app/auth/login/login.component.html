<app-header></app-header>
<main class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 py-8">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white rounded-2xl  overflow-hidden">
            <div class="flex flex-col lg:flex-row">

                <!-- Login Form Section -->
                <div class="lg:w-1/2 p-8 lg:p-8">
                    <div class="max-w-md mx-auto">
                        <div class="text-center mb-8">
                            <h2 class="text-3xl font-bold text-gray-900 mb-2">Login to your account</h2>
                            <p class="text-gray-600 mb-8">Welcome back! Please sign in to continue.</p>
                        </div>
                        <form [formGroup]="loginFrm" (ngSubmit)="onSubmit()" class="space-y-6">
                            <!-- Username Field -->
                            <mat-form-field class="w-full">
                                <mat-label>Username</mat-label>
                                <input type="text" matInput formControlName="username" placeholder="Ex. john7615">
                                <mat-icon matSuffix>person</mat-icon>
                                <mat-error *ngIf="lgnUserEmail.hasError('required')">
                                    Username or email is <strong>required</strong>
                                </mat-error>
                                <mat-error
                                    *ngIf="lgnUserEmail.hasError('pattern') && !lgnUserEmail.hasError('required')">
                                    Please enter a valid username or email address
                                </mat-error>
                            </mat-form-field>

                            <!-- Password Field -->
                            <mat-form-field class="w-full">
                                <mat-label>Password</mat-label>
                                <input [type]="isPasswordVisible ? 'text' : 'password'" matInput
                                    formControlName="password" placeholder="Enter your password" required>
                                <button type="button" mat-icon-button matSuffix (click)="togglePasswordVisibility()"
                                    class="hover:bg-gray-100 rounded-full">
                                    <mat-icon>{{isPasswordVisible ? 'visibility' : 'visibility_off'}}</mat-icon>
                                </button>
                                <mat-error *ngIf="lgnUserEmail.hasError('required')">
                                    Password is <strong>required</strong>
                                </mat-error>
                            </mat-form-field>

                            <!-- Submit Button -->
                            <button mat-raised-button color="primary" type="submit"
                                class="w-full py-3 text-lg font-semibold transition-all duration-300 transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                                [disabled]="loginFrm.invalid">
                                Sign In
                            </button>
                        </form>

                        <div class="text-center mt-6">
                            <a [routerLink]="['/forget']"
                                class="text-blue-600 hover:text-blue-800 font-medium transition-colors">
                                Forgot your password?
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Image Section -->
                <div class="lg:w-1/2 flex items-center justify-center p-8">
                    <div class="text-center text-gray-900">
                        <img [src]="RegImg" class="w-full max-w-md mx-auto rounded-2xl shadow-2xl" alt="SPXAM Login">
                        <h3 class="text-2xl font-bold mt-6 mb-3">Welcome to SPXAM</h3>
                        <p class="text-gray-900 text-lg">Your trusted platform for online testing and assessments</p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<app-footer></app-footer>
